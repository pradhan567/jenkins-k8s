apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: flux-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: ""
    http:
      paths:
      - path: /jenkins
        pathType: Prefix
        backend:
          service:
            name: jenkins-service.jenkins.svc.cluster.local
            port:
              number: 8080
      - path: /bbapp
        pathType: Prefix
        backend:
          service:
            name: block-buster-service.1-demo.svc.cluster.local
            port:
              number: 80
